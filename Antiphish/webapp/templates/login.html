{% extends "base.html" %}
{% block title %}Prijava – AntiPhish{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Prijava</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email <input type="email" name="email" required autocomplete="username"></label>
    <label>Lozinka <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary">Prijavi se</button>
  </form>
  <p class="muted">Beta je samo na poziv. Nalog otvara administrator.</p>
</section>
{% endblock %}
