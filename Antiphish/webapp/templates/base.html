<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}AntiPhish{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">🛡️ AntiPhish</a>
  {% if user %}
  <nav>
    <a href="/">Provjeri mail</a>
    <a href="/history">Historija</a>
    <a href="/account">Nalog</a>
    {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
    <span class="credits">{{ user.credits }} kredita</span>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">Odjava</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% if flash %}<div class="flash {{ flash.kind }}">{{ flash.msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer>
  <span>AntiPhish beta – pomoćni alat, ne garantuje 100% zaštitu.</span>
  <a href="/privacy">Privatnost</a>
</footer>
</body>
</html>
