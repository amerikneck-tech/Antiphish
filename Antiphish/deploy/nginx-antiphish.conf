# Use this INSTEAD of Caddy if your VPS already runs nginx on ports 80/443.
# 1) docker compose up -d web          (no caddy)
# 2) copy to /etc/nginx/sites-available/antiphish, symlink to sites-enabled
# 3) sudo certbot --nginx -d antiphish.example.com
server {
    listen 80;
    server_name antiphish.example.com;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
